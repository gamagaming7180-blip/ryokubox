[package]
name = "ryokubox"
version = "1.0.0"
edition = "2021"
description = "Ryoku Box — a fresh single-binary Lithic companion agent for Ryoku Linux"
license = "GPL-3.0-or-later"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full", "process"] }
tokio-stream = { version = "0.1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["fs", "cors", "trace"] }
subtle = "2"
sysinfo = "0.30"
libc = "0.2"
mime_guess = "2"
futures-util = "0.3"
qrcode = { version = "0.14", features = ["svg"] }
rand = "0.8"

[profile.release]
opt-level = 2
lto = true
strip = true
